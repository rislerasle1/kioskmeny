<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kioskmeny</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}.slide{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;visibility:hidden}.slide.active{opacity:1;visibility:visible}#error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#112f4a;color:#fff;font:700 28px Arial;padding:40px;text-align:center}</style></head><body><iframe class="slide active" id="frame"></iframe><div id="error"></div><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="sheets-config.js"></script><script src="google-sheets-loader.js"></script><script>
let slides=[],current=0,timer,kiosk;
const weekdays=["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"],toMin=s=>{const [h,m]=String(s).split(":").map(Number);return h*60+m};
function isOpen(){if(!kiosk)return false;const n=new Date(),o=kiosk.openingHours.find(x=>x.day===weekdays[n.getDay()]);if(!o||!o.open||!o.close)return false;const c=n.getHours()*60+n.getMinutes();return c>=toMin(o.open)&&c<toMin(o.close);}
async function buildRotation(){try{const data=await loadKioskData(true);kiosk=data;const pages=paginateMenu(data.menuCategories);slides=[{file:"sidea.html",duration:7000},...pages.map((_,i)=>({file:`sideb.html?page=${i+1}`,duration:15000})),...(data.gearCategories.length?paginateMenu(data.gearCategories):[]).map((_,i)=>({file:`sided.html?page=${i+1}`,duration:12000})),{file:"sidec.html",duration:5000}];show(0);}catch(e){error.style.display="flex";error.textContent=e.message;}}
function show(i){if(slides[i].file==="sidea.html"&&isOpen()&&slides.length>1)i=(i+1)%slides.length;current=i;frame.src=slides[i].file+(slides[i].file.includes("?")?"&":"?")+"v="+Date.now();clearTimeout(timer);timer=setTimeout(()=>show((i+1)%slides.length),slides[i].duration);}
buildRotation();setInterval(buildRotation,300000);
</script></body></html>
