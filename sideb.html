<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kioskmeny – mat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kiosk.css">
</head><body><div class="stage">
<aside>
  <div class="brand"><img src="https://cdn-bloc.no/background/200000195/7987/2026/4/23/hl_logo.png" alt="Hasle/Løren"><span class="kicker">Hasle/Løren</span></div>
  <h1>Meny</h1>
  <p id="intro"></p>
  <div class="status"><div id="hours"></div><div id="hoursNote"></div></div>
  <div id="error"></div>
  <div class="marg">
    <div id="hostBox"><div class="kicker">Kioskvert</div><div id="host"></div></div>
    <div id="clock"></div><div id="date"></div>
  </div>
</aside>
<main><div class="top"><span id="pageInfo"></span></div><div class="menu" id="menu"></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="sheets-config.js"></script><script src="google-sheets-loader.js"></script><script src="marg.js"></script><script src="hilsener.js"></script>
<script>
loadKioskData(true).then(d=>{
  const pages=paginateMenu(d.menuCategories),page=Math.max(1,Number(new URLSearchParams(location.search).get("page"))||1),cats=pages[page-1]||[];
  pageInfo.textContent=pages.length>1?`Side ${page} av ${pages.length}`:"";
  intro.textContent=dagensHilsen();
  showHost(d);showHours(d);
  menu.innerHTML=cats.map(c=>`<section class="block"><h2>${esc(c.name)}</h2>${c.items.map(i=>`<div class="item"><div class="name">${esc(i.name)}${i.badge?`<span class="badge">${esc(i.badgeIcon)} ${esc(i.badge)}</span>`:""}</div><div class="price">${esc(i.price)},-</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:""}</div>`).join("")}</section>`).join("");
}).catch(e=>error.textContent=e.message);
</script></body></html>
