<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kioskmeny beta</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}body{background:#f6f8fb;color:#112f4a}.screen{height:100%;display:grid;grid-template-columns:27% 73%}aside{background:#112f4a;color:#fff;padding:5vh 2.8vw}h1{font-size:clamp(40px,4.8vw,76px);line-height:.95}aside p,.note{color:#c3d0db}.pill{display:inline-block;margin-top:3vh;padding:.7em 1em;border-radius:10px;background:#ef3e36;font-weight:900}main{padding:3vh;display:grid;grid-template-rows:auto 1fr;gap:2vh}.top{display:flex;justify-content:space-between;align-items:center}.menu{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:1.5vw;min-height:0}.block{background:#fff;border-radius:22px;padding:2vh 1.5vw;overflow:hidden;box-shadow:0 10px 30px rgba(17,47,74,.08)}.item{display:grid;grid-template-columns:1fr auto;gap:1vw;padding:.8vh 0;border-top:1px solid #e6edf3}.name{font-weight:800;font-size:clamp(14px,1.35vw,23px)}.price{font-weight:900;color:#ef3e36;font-size:clamp(15px,1.45vw,25px)}.desc{grid-column:1/2;color:#6f8293;font-size:clamp(10px,.82vw,14px)}.badge{margin-left:.5em;padding:.25em .65em;border-radius:999px;background:#ef3e36;color:#fff;font-size:.65em;white-space:nowrap}.screen{grid-template-rows:100%}main{min-height:0}aside{display:flex;flex-direction:column;min-height:0}.marg{margin-top:auto}#clock{font-size:clamp(40px,5.5vw,96px);font-weight:900;line-height:1}#date{font-size:clamp(14px,1.4vw,24px);font-weight:700;opacity:.85;margin-top:.4vh}#hoursNote{margin-top:1.2vh;font-size:clamp(12px,1vw,17px);font-style:italic}#hostBox{margin-top:2.5vh}.label{display:inline-block;padding:.35em .8em;border-radius:999px;font-weight:900;font-size:clamp(11px,.9vw,15px);background:#ef3e36}#host{margin-top:.8vh;font-size:clamp(16px,1.6vw,28px);font-weight:800}</style></head><body><div class="screen"><aside><b>HASLE-LØREN</b><h1>KIOSK<br>MENY</h1><p id="intro"></p><div class="pill" id="hours"></div><div class="note" id="hoursNote"></div><div id="error"></div><div class="marg"><div id="clock"></div><div id="date"></div><div id="hostBox"><span class="label">KIOSKVERT</span><div id="host"></div></div></div></aside><main><div class="top"><h2>Meny</h2><span id="pageInfo"></span><span id="notice"></span></div><div class="menu" id="menu"></div></main></div><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script src="sheets-config.js"></script><script src="google-sheets-loader.js"></script><script src="marg.js"></script><script>loadKioskData(true).then(d=>{const pages=paginateMenu(d.menuCategories),page=Math.max(1,Number(new URLSearchParams(location.search).get("page"))||1),cats=pages[page-1]||[];pageInfo.textContent=pages.length>1?`Side ${page} av ${pages.length}`:"";intro.textContent=d.settings.menuIntro;notice.textContent=d.settings.menuNotice;showHost(d);showHours(d);menu.innerHTML=cats.map(c=>`<section class="block"><h2>${esc(c.name)}</h2>${c.items.map(i=>`<div class="item"><div class="name">${esc(i.name)}${i.badge?`<span class="badge">${esc(i.badgeIcon)} ${esc(i.badge)}</span>`:""}</div><div class="price">${esc(i.price)},-</div>${i.description?`<div class="desc">${esc(i.description)}</div>`:""}</div>`).join("")}</section>`).join("")}).catch(e=>error.textContent=e.message)</script></body></html>
